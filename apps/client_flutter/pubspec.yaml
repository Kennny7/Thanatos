name: thanatos_client
description: Cross‑platform Flutter client for Thanatos AI assistant.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  web_socket_channel: ^2.4.4
  speech_to_text: ^6.6.1
  flutter_dotenv: ^5.1.0
  uuid: ^4.3.3
  intl: ^0.19.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - .env