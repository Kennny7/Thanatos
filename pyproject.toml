[project]
name = "thanatos"
version = "0.1.0"
dependencies = [
    "openai>=2.32.0",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "httpx>=0.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "shared*",
    "services*",
    "plugins*",
    "sandbox*",
    "audit*",
    "apps.api_server*"
]