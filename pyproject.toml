[project]
name = "thanatos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai~=2.32",
    "fastapi~=0.116",
    "uvicorn~=0.35",
    "pydantic~=2.11",
    "pydantic-settings~=2.10",
    "httpx~=0.28",
    "tenacity~=9.0",
    "playwright~=1.40",
    "numpy~=2.0",
    "python-multipart~=0.0.9",
    "pyautogui~=0.9",
    "chromadb~=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.0",
    "pytest-asyncio~=0.20",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# uv configuration — deterministic, lock-file-based dependency management
# ---------------------------------------------------------------------------
[tool.uv]
# Regenerate the lock file with: uv lock
# Install from the lock file with: uv sync  (or  uv sync --extra dev)
# The uv.lock file MUST be committed to version control.

[tool.setuptools.packages.find]
where = ["."]
include = [
    "shared*",
    "services*",
    "plugins*",
    "sandbox*",
    "audit*",
    "apps.api_server*"
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]