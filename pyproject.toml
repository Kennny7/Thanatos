[project]
name = "thanatos"
version = "0.1.0"
dependencies = [
    "openai>=2.32.0",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "playwright>=1.40",
    "numpy>=2.0.0",
    "python-multipart>=0.0.9",
    "pyautogui>=0.9.53",
    "chromadb>=1.5.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.20.0"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "shared*",
    "services*",
    "plugins*",
    "sandbox*",
    "audit*",
    "apps.api_server*"
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]